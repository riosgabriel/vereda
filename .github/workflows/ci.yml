name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Bun
        if: matrix.runtime == 'node'
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"

      - name: Install dependencies
        if: matrix.runtime == 'bun'
        run: bun install

      - name: Install dependencies
        if: matrix.runtime == 'node'
        run: npm ci

      - name: Typecheck
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx tsc --noEmit
          else
            npm run typecheck
          fi

      - name: Lint
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            eslint .
          else
            npm run lint
          fi

      - name: Format check
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            prettier --check .
          else
            npm run format:check
          fi

      - name: Test
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx vitest run
          else
            npm test
          fi

      - name: Build
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx tsc
          else
            npm run build
          fi

  ci:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        if: needs.test.result != 'success'
        run: exit 1
