name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Full-tree check, not `--changed`: the repo checks in ~60ms, and
      # `--changed` both skips files on push-to-main and fails opaquely when
      # the base ref is missing from a shallow checkout.
      - name: Biome
        run: bun run ci

  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Bun installs from bun.lock; Node is what actually runs the suite.
      # The package.json scripts are runtime-agnostic (`vitest run`, not
      # `bunx vitest run`), so the caller decides the runtime — `npm run`
      # here resolves node_modules/.bin and executes under the matrix Node.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify runtime is Node ${{ matrix.node-version }}
        run: node --version

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  test-bun:
    name: test (bun runtime)
    runs-on: ubuntu-latest
    # Non-blocking: the suite has 3 known failures under the Bun runtime
    # (zod resolving to undefined in test/core/client.integration.test.ts, and a
    # retry-count divergence in test/core/retry-matrix.test.ts). They are
    # pre-existing and unrelated to this workflow. Flip this to blocking once
    # they're fixed — until then this leg reports Bun compatibility without
    # gating merges.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `--bun` forces the Bun runtime. Without it, bun respects the vitest
      # shebang and silently runs the suite under Node — which is why the old
      # `bunx vitest run` matrix never actually exercised Bun.
      - name: Test
        run: bun run --bun test

  ci:
    if: always()
    needs: [lint, test, test-bun]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: needs.lint.result != 'success' || needs.test.result != 'success'
        run: exit 1
