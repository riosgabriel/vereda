name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        if: matrix.runtime == 'bun'
        run: bun install

      - name: Install dependencies
        if: matrix.runtime == 'node'
        run: npm ci

      - name: Typecheck
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx tsc --noEmit
          else
            npx tsc --noEmit
          fi

      - name: Lint
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx eslint .
          else
            npx eslint .
          fi

      - name: Format check
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx prettier --check .
          else
            npx prettier --check .
          fi

      - name: Test
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx vitest run
          else
            npx vitest run
          fi

      - name: Build
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx tsc
          else
            npx tsc
          fi

  ci:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        if: needs.test.result != 'success'
        run: exit 1
