name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        include:
          - node-version: 20
            runtime: bun
          - node-version: 22
            runtime: bun
          - node-version: 24
            runtime: bun
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        if: matrix.runtime == 'bun'
        run: bun install

      - name: Install dependencies
        if: matrix.runtime != 'bun'
        run: npm ci

      - name: Typecheck
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx tsc --noEmit
          else
            npm run typecheck
          fi

      - name: Lint
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx eslint .
          else
            npm run lint
          fi

      - name: Format check
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx prettier --check .
          else
            npm run format:check
          fi

      - name: Test
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx vitest run
          else
            npm test
          fi

      - name: Build
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bunx tsc
          else
            npm run build
          fi

  ci:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        if: needs.test.result != 'success'
        run: exit 1
