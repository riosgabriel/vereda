name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs target their parent branch, not main, and
  # would otherwise get no CI at all.
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Full-tree check, not `--changed`: the repo checks in ~60ms, and
      # `--changed` both skips files on push-to-main and fails opaquely when
      # the base ref is missing from a shallow checkout.
      - name: Biome
        run: bun run ci

  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Bun installs from bun.lock; Node is what actually runs the suite.
      # The package.json scripts are runtime-agnostic (`vitest run`, not
      # `bunx vitest run`), so the caller decides the runtime — `npm run`
      # here resolves node_modules/.bin and executes under the matrix Node.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify runtime is Node ${{ matrix.node-version }}
        run: node --version

      - name: Typecheck
        run: npm run typecheck

      # Self-verifying: the example itself asserts the README's "one failing
      # dependency" claims (bulkhead isolation, retries, circuit breaker) and
      # exits non-zero if any don't hold. Runs once (node 22), not on both
      # legs — same reasoning as coverage below: it's the same demo,
      # running it twice would be pure waste.
      - name: Run checkout example
        if: matrix.node-version == 22
        run: npm run example:checkout

      # EXPECTED_RUNTIME makes the runtime an assertion instead of an
      # assumption: test/core/retry-matrix.test.ts fails the run if the suite
      # is not executing under the runtime this leg is meant to cover.
      # Coverage only runs once (node 22), not on both legs — it's the
      # same suite, just instrumented, so running it twice would be pure waste.
      - name: Test
        if: matrix.node-version != 22
        run: npm test
        env:
          EXPECTED_RUNTIME: node

      - name: Test with coverage
        if: matrix.node-version == 22
        run: npm run test:coverage
        env:
          EXPECTED_RUNTIME: node

      - name: Upload coverage report
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

      # Packaging hygiene from VRD-53 (package.json exports/types shape) stays
      # enforced here so a future exports/package.json edit can't silently
      # regress it. Runs once (node 22), against the just-built dist/.
      - name: Verify package is publishable (publint)
        if: matrix.node-version == 22
        run: npx publint

      - name: Verify package types resolve (arethetypeswrong)
        if: matrix.node-version == 22
        run: npx attw --pack .

  # Canary, not a gate: TypeScript 7 gutted the classic `require("typescript")`
  # compiler-API surface (only `version`/`versionMajorMinor` remain), which is
  # why devDependencies pins ^6.0.0 and TypeDoc works at all today. This job
  # tracks how far `src/` is from typechecking clean under 7 without blocking
  # merges or the `ci` gate — `continue-on-error` and exclusion from `needs`
  # below are both load-bearing.
  typecheck-next:
    name: typecheck (typescript next, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Installed on top of (not via) the frozen lockfile: this overwrites
      # node_modules/typescript in this job's runner only, and the direct
      # binary path sidesteps an npx arg-parsing quirk with this package's
      # bin resolution that otherwise misreads `tsc` itself as a root file.
      - name: Install TypeScript 7
        run: npm install --no-save typescript@^7

      - name: Typecheck against TypeScript 7
        run: |
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/tsc --noEmit -p tsconfig.test.json
          ./node_modules/.bin/tsc --noEmit -p examples/tsconfig.json
          ./node_modules/.bin/tsc --noEmit -p performance/tsconfig.json

  # Informational for now, same as typecheck-next: `continue-on-error` and
  # exclusion from `needs` below keep it from blocking merges. The suite exits
  # non-zero on a threshold breach, but its latency ceilings (e.g. p95 ≤ 100ms)
  # were set on a dev machine, and shared runners are noisier. Promote it to
  # the gate once it has a green track record here.
  bench:
    name: bench (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # performance/ has its own bun.lock (tsx lives there). It imports vereda
      # from ../src through tsconfig `paths`, so no root install or build is
      # needed.
      - name: Install dependencies
        working-directory: performance
        run: bun install --frozen-lockfile

      - name: Run benchmark suite
        working-directory: performance
        run: bun run bench

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: performance/results/
          retention-days: 14
          if-no-files-found: ignore

  test-bun:
    name: test (bun runtime)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `--bun` forces the Bun runtime. Without it, bun respects the vitest
      # shebang and silently runs the suite under Node — which is why the old
      # `bunx vitest run` matrix never actually exercised Bun. EXPECTED_RUNTIME
      # turns that into a checked invariant: if `--bun` ever stops reaching
      # vitest's workers, this leg fails loudly instead of quietly becoming a
      # fourth Node run.
      - name: Test
        run: bun run --bun test
        env:
          EXPECTED_RUNTIME: bun

  ci:
    if: always()
    needs: [lint, test, test-bun]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: needs.lint.result != 'success' || needs.test.result != 'success' || needs['test-bun'].result != 'success'
        run: exit 1
