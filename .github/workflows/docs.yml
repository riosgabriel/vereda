name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      # The site reads docs/book, docs/guide and docs/operations.md in place.
      - name: Build site
        working-directory: site
        run: bun run build

      # TypeDoc reads types straight from src/ — no dist/ build needed. Until the API
      # reference moves into the site itself, it is served as is under /api/.
      - name: Generate API reference
        run: npx typedoc --out site/dist/api

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
