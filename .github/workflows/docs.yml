name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      # The sidebar's book downloads: pandoc writes the EPUB and the PDF's HTML, Chromium
      # draws the diagrams and prints the PDF. They land in site/public/downloads/.
      # Pandoc and Chromium take a minute or two to install, so the files are cached under a key
      # made from everything that shapes them and only rebuilt when one of those changes.
      - name: Restore book downloads
        id: book-cache
        uses: actions/cache@v6
        with:
          path: site/public/downloads
          key: book-downloads-${{ hashFiles('docs/book/**', 'site/scripts/book-download.ts', 'site/scripts/book-print.css', 'site/scripts/book-cover.html', 'site/src/assets/logo.png', 'site/src/doc-ids.ts', 'site/bun.lock') }}

      - name: Build book downloads
        if: steps.book-cache.outputs.cache-hit != 'true'
        working-directory: site
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          bunx playwright install --with-deps chromium
          bun run book:download
          # W3C's validator: a broken EPUB never reaches the site.
          curl -sL -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          java -jar "$RUNNER_TEMP/epubcheck-5.4.0/epubcheck.jar" --failonwarnings public/downloads/vereda-book.epub

      # The site reads docs/book, docs/guide and docs/operations.md in place, and
      # starlight-typedoc generates the API pages from src/ (no dist/ build needed).
      - name: Build site
        working-directory: site
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
