name: Bug report
description: Report a problem with vereda
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal code that reproduces the issue.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "e.g. 22.x"
    validations:
      required: true
  - type: input
    id: vereda-version
    attributes:
      label: vereda version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
